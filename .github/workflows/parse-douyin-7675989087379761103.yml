name: Parse Douyin 7675989087379761103

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - ".github/trigger/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/parse-douyin-7675989087379761103.yml"
      - ".github/trigger/**"

permissions:
  contents: read

env:
  VIDEO_ID: "7675989087379761103"
  SHARE_URL: "https://v.douyin.com/R7YR8ZKTigk/"
  OUT_DIR: "outputs/7675989087379761103"

jobs:
  parse-transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout scratch repository
        uses: actions/checkout@v4

      - name: Install media and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq xvfb
          google-chrome --version
          python -m pip install -q --upgrade playwright requests

      - name: Capture target API response and download validated media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"

          cat > /tmp/capture_target.py <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote

          import requests
          from playwright.sync_api import sync_playwright

          video_id = os.environ["VIDEO_ID"]
          share_url = os.environ["SHARE_URL"]
          out = Path(os.environ["OUT_DIR"])
          out.mkdir(parents=True, exist_ok=True)

          desktop_ua = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )
          mobile_ua = (
              "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) "
              "AppleWebKit/605.1.15 (KHTML, like Gecko) "
              "Version/18.6 Mobile/15E148 Safari/604.1"
          )

          attempts = [
              {
                  "name": "desktop",
                  "url": f"https://www.douyin.com/video/{video_id}",
                  "ua": desktop_ua,
                  "viewport": {"width": 1440, "height": 1000},
                  "mobile": False,
              },
              {
                  "name": "mobile-share",
                  "url": f"https://www.iesdouyin.com/share/video/{video_id}",
                  "ua": mobile_ua,
                  "viewport": {"width": 430, "height": 932},
                  "mobile": True,
              },
              {
                  "name": "mobile-short-link",
                  "url": share_url,
                  "ua": mobile_ua,
                  "viewport": {"width": 430, "height": 932},
                  "mobile": True,
              },
          ]

          api_responses = []
          page_records = []
          all_cookies = []
          network_media = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=False,
                  executable_path="/usr/bin/google-chrome",
                  args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-blink-features=AutomationControlled",
                      "--autoplay-policy=no-user-gesture-required",
                      "--lang=zh-CN",
                  ],
              )

              for attempt in attempts:
                  context = browser.new_context(
                      user_agent=attempt["ua"],
                      locale="zh-CN",
                      timezone_id="Asia/Shanghai",
                      viewport=attempt["viewport"],
                      is_mobile=attempt["mobile"],
                      has_touch=attempt["mobile"],
                      device_scale_factor=2 if attempt["mobile"] else 1,
                      extra_http_headers={"Accept-Language": "zh-CN,zh;q=0.9,en;q=0.6"},
                  )
                  context.add_init_script(
                      "Object.defineProperty(navigator, 'webdriver', {get: () => undefined});"
                  )
                  page = context.new_page()
                  page.set_default_timeout(5000)

                  def on_response(response):
                      try:
                          url = response.url
                          content_type = response.headers.get("content-type", "")
                          resource_type = response.request.resource_type
                          if resource_type == "media" or content_type.lower().startswith("video/"):
                              network_media.append(
                                  {
                                      "attempt": attempt["name"],
                                      "url": url,
                                      "status": response.status,
                                      "content_type": content_type,
                                  }
                              )

                          relevant = (
                              "/aweme/v1/web/aweme/detail/" in url
                              or "/web/api/v2/aweme/post/" in url
                              or "/web/api/v2/aweme/slidesinfo/" in url
                          )
                          if relevant:
                              body = response.text()
                              api_responses.append(
                                  {
                                      "attempt": attempt["name"],
                                      "url": url,
                                      "status": response.status,
                                      "content_type": content_type,
                                      "body": body,
                                  }
                              )
                      except Exception as exc:
                          api_responses.append(
                              {
                                  "attempt": attempt["name"],
                                  "url": getattr(response, "url", ""),
                                  "capture_error": f"{type(exc).__name__}: {exc}",
                              }
                          )

                  page.on("response", on_response)
                  record = {
                      "name": attempt["name"],
                      "requested_url": attempt["url"],
                      "final_url": "",
                      "title": "",
                      "description": "",
                      "error": "",
                  }

                  try:
                      page.goto(attempt["url"], wait_until="domcontentloaded", timeout=120000)
                      page.wait_for_timeout(18000)
                      record["final_url"] = page.url
                      record["title"] = page.title()
                      description = page.locator('meta[name="description"]')
                      if description.count() > 0:
                          record["description"] = description.first.get_attribute("content") or ""
                      page.screenshot(path=str(out / f"{attempt['name']}.png"), full_page=True)
                      (out / f"{attempt['name']}.html").write_text(page.content(), encoding="utf-8")
                  except Exception as exc:
                      record["error"] = f"{type(exc).__name__}: {exc}"
                  finally:
                      all_cookies.extend(context.cookies())
                      page_records.append(record)
                      context.close()

              browser.close()

          (out / "page-records.json").write_text(
              json.dumps(page_records, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (out / "network-media.json").write_text(
              json.dumps(network_media, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (out / "api-responses.json").write_text(
              json.dumps(api_responses, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          parsed_payloads = []
          for index, item in enumerate(api_responses, start=1):
              body = item.get("body", "")
              try:
                  payload = json.loads(body)
              except Exception:
                  continue
              parsed_payloads.append(payload)
              (out / f"api-response-{index:02d}.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          def find_aweme(node):
              if isinstance(node, dict):
                  if str(node.get("aweme_id", "")) == video_id and isinstance(node.get("video"), dict):
                      return node
                  for value in node.values():
                      found = find_aweme(value)
                      if found is not None:
                          return found
              elif isinstance(node, list):
                  for value in node:
                      found = find_aweme(value)
                      if found is not None:
                          return found
              return None

          aweme = None
          for payload in parsed_payloads:
              aweme = find_aweme(payload)
              if aweme is not None:
                  break

          if aweme is None:
              diagnostics = {
                  "video_id": video_id,
                  "parsed_payload_count": len(parsed_payloads),
                  "api_response_count": len(api_responses),
                  "page_records": page_records,
              }
              (out / "target-not-found.json").write_text(
                  json.dumps(diagnostics, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              print("Target aweme object was not found in captured API responses", file=sys.stderr)
              sys.exit(2)

          (out / "target-aweme.json").write_text(
              json.dumps(aweme, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          video = aweme.get("video") or {}
          candidate_rows = []

          def normalise_url(value):
              if not isinstance(value, str):
                  return ""
              value = value.replace("\\u0026", "&").replace("\\/", "/").strip()
              try:
                  value = unquote(value)
              except Exception:
                  pass
              if value.startswith("//"):
                  value = "https:" + value
              return value if value.startswith(("http://", "https://")) else ""

          def collect_urls(node, path="video"):
              if isinstance(node, dict):
                  for key, value in node.items():
                      next_path = f"{path}.{key}"
                      if key == "url_list" and isinstance(value, list):
                          for raw_url in value:
                              url = normalise_url(raw_url)
                              if not url:
                                  continue
                              lower_path = next_path.lower()
                              lower_url = url.lower()
                              score = 0
                              if "play_addr" in lower_path:
                                  score += 60
                              if "play_addr_h264" in lower_path or "h264" in lower_path:
                                  score += 18
                              if "download_addr" in lower_path:
                                  score += 25
                              if "bit_rate" in lower_path:
                                  score += 10
                              if "h265" in lower_path or "bytevc1" in lower_path or "hevc" in lower_path:
                                  score -= 8
                              if "douyinvod" in lower_url or "amemv" in lower_url or "bytevcloudvod" in lower_url:
                                  score += 12
                              candidate_rows.append(
                                  {
                                      "url": url,
                                      "path": next_path,
                                      "score": score,
                                  }
                              )
                      else:
                          collect_urls(value, next_path)
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      collect_urls(value, f"{path}[{index}]")

          collect_urls(video)
          dedup = {}
          for row in candidate_rows:
              existing = dedup.get(row["url"])
              if existing is None or row["score"] > existing["score"]:
                  dedup[row["url"]] = row
          candidates = sorted(dedup.values(), key=lambda row: row["score"], reverse=True)
          (out / "target-media-candidates.json").write_text(
              json.dumps(candidates, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if not candidates:
              print("Target aweme was found but contained no HTTP media URL", file=sys.stderr)
              sys.exit(3)

          cookie_map = {}
          for cookie in all_cookies:
              name = cookie.get("name", "")
              if name:
                  cookie_map[name] = cookie.get("value", "")
          (out / "browser-cookies.json").write_text(
              json.dumps(all_cookies, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          session = requests.Session()
          session.headers.update(
              {
                  "User-Agent": desktop_ua,
                  "Referer": f"https://www.douyin.com/video/{video_id}",
                  "Accept": "*/*",
              }
          )
          for cookie in all_cookies:
              try:
                  session.cookies.set(
                      cookie.get("name", ""),
                      cookie.get("value", ""),
                      domain=cookie.get("domain") or None,
                      path=cookie.get("path") or "/",
                  )
              except Exception:
                  pass

          inspections = []
          valid_downloads = []
          for index, candidate in enumerate(candidates[:16], start=1):
              url = candidate["url"]
              temp_path = out / f"candidate-{index:02d}.mp4"
              inspection = {**candidate, "index": index}
              try:
                  with session.get(url, stream=True, timeout=(20, 180), allow_redirects=True) as response:
                      inspection["http_status"] = response.status_code
                      inspection["content_type"] = response.headers.get("content-type", "")
                      if response.status_code not in (200, 206):
                          inspections.append(inspection)
                          continue
                      size = 0
                      with temp_path.open("wb") as handle:
                          for chunk in response.iter_content(chunk_size=1024 * 1024):
                              if chunk:
                                  handle.write(chunk)
                                  size += len(chunk)
                      inspection["downloaded_bytes"] = size

                  probe = subprocess.run(
                      [
                          "ffprobe",
                          "-v", "error",
                          "-show_entries", "format=duration,size:stream=codec_type,codec_name,width,height",
                          "-of", "json",
                          str(temp_path),
                      ],
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=60,
                  )
                  inspection["ffprobe_exit_code"] = probe.returncode
                  if probe.returncode != 0:
                      inspection["ffprobe_stderr"] = probe.stderr[-2000:]
                      inspections.append(inspection)
                      temp_path.unlink(missing_ok=True)
                      continue

                  probe_json = json.loads(probe.stdout)
                  inspection["probe"] = probe_json
                  streams = probe_json.get("streams") or []
                  has_video = any(stream.get("codec_type") == "video" for stream in streams)
                  has_audio = any(stream.get("codec_type") == "audio" for stream in streams)
                  duration = float((probe_json.get("format") or {}).get("duration") or 0)
                  inspection["has_video"] = has_video
                  inspection["has_audio"] = has_audio
                  inspection["duration"] = duration
                  validation_score = candidate["score"] + min(duration, 300)
                  if has_audio:
                      validation_score += 1000
                  if has_video:
                      validation_score += 500
                  inspection["validation_score"] = validation_score
                  inspections.append(inspection)

                  if has_video and duration > 3:
                      valid_downloads.append((validation_score, temp_path, inspection))
                  else:
                      temp_path.unlink(missing_ok=True)
              except Exception as exc:
                  inspection["error"] = f"{type(exc).__name__}: {exc}"
                  inspections.append(inspection)
                  temp_path.unlink(missing_ok=True)

          (out / "media-inspections.json").write_text(
              json.dumps(inspections, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if not valid_downloads:
              print("No target media candidate passed ffprobe validation", file=sys.stderr)
              sys.exit(4)

          valid_downloads.sort(key=lambda item: item[0], reverse=True)
          _, selected_path, selected = valid_downloads[0]
          final_path = out / "video.mp4"
          shutil.move(str(selected_path), final_path)
          for _, path, _ in valid_downloads[1:]:
              path.unlink(missing_ok=True)

          metadata = {
              "video_id": video_id,
              "share_url": share_url,
              "title": aweme.get("desc", ""),
              "author": aweme.get("author", {}),
              "create_time": aweme.get("create_time"),
              "duration_ms": video.get("duration"),
              "selected_media": selected,
          }
          (out / "metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

          xvfb-run -a python /tmp/capture_target.py 2>&1 | tee "$OUT_DIR/capture-target.log"
          test -s "$OUT_DIR/video.mp4"

          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate \
            -of json "$OUT_DIR/video.mp4" > "$OUT_DIR/ffprobe.json"
          cat "$OUT_DIR/ffprobe.json"

      - name: Extract audio and representative frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/frames"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$OUT_DIR/video.mp4" \
            -vn -ac 1 -ar 16000 \
            "$OUT_DIR/audio.wav"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$OUT_DIR/video.mp4" \
            -vf "fps=1/2,scale='min(1080,iw)':-2" \
            -q:v 2 \
            "$OUT_DIR/frames/frame_%04d.jpg"

          ffmpeg -hide_banner -loglevel error -y \
            -i "$OUT_DIR/video.mp4" \
            -vf "fps=1/3,scale=420:-2,tile=4x5:padding=8:margin=8" \
            -frames:v 1 \
            "$OUT_DIR/contact-sheet.jpg" || true

          find "$OUT_DIR/frames" -type f | sort > "$OUT_DIR/frame-list.txt"

      - name: Transcribe Chinese speech
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade openai-whisper
          whisper "$OUT_DIR/audio.wav" \
            --model small \
            --language Chinese \
            --task transcribe \
            --fp16 False \
            --output_dir "$OUT_DIR" \
            --output_format all \
            --verbose True 2>&1 | tee "$OUT_DIR/whisper.log"

          cp "$OUT_DIR/audio.txt" "$OUT_DIR/transcript.txt"
          cp "$OUT_DIR/audio.srt" "$OUT_DIR/transcript.srt"

          echo "===== TRANSCRIPT START ====="
          cat "$OUT_DIR/transcript.txt"
          echo "===== TRANSCRIPT END ====="

      - name: Upload complete evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-7675989087379761103-evidence
          path: outputs/7675989087379761103
          if-no-files-found: error
          retention-days: 3
