name: Probe Douyin resolvers 7675989087379761103

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths: [".github/trigger/**"]

permissions:
  contents: read

env:
  VIDEO_ID: "7675989087379761103"
  SHORT_URL: "https://v.douyin.com/R7YR8ZKTigk/"
  LONG_URL: "https://www.douyin.com/video/7675989087379761103"
  OUT_DIR: "outputs/7675989087379761103-resolver-matrix"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe resolver matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.parse import quote
          import requests

          vid = os.environ['VIDEO_ID']
          short = os.environ['SHORT_URL']
          long_url = os.environ['LONG_URL']
          out = Path(os.environ['OUT_DIR'])
          out.mkdir(parents=True, exist_ok=True)

          probes = [
              ('aa1_text_short', f'https://zj.v.api.aa1.cn/api/douyinjx/?text={quote(short, safe="")}'),
              ('aa1_text_long', f'https://zj.v.api.aa1.cn/api/douyinjx/?text={quote(long_url, safe="")}'),
              ('aa1_aweme_id', f'https://zj.v.api.aa1.cn/api/douyinjx/?aweme_id={vid}'),
              ('suxun_short', f'https://api.suxun.site/api/douyin?url={quote(short, safe="")}'),
              ('suxun_long', f'https://api.suxun.site/api/douyin?url={quote(long_url, safe="")}'),
              ('mymzf_short', f'https://api.mymzf.com/api/douyin2?url={quote(short, safe="")}'),
              ('mymzf_long', f'https://api.mymzf.com/api/douyin2?url={quote(long_url, safe="")}'),
              ('youman_short', f'https://api.youman.team/douyin?url={quote(short, safe="")}'),
              ('youman_long', f'https://api.youman.team/douyin?url={quote(long_url, safe="")}'),
              ('zhuadouyin_video', f'https://www.zhuadouyin.com/video/{vid}'),
              ('zhuadouyin_resolve_short', f'https://www.zhuadouyin.com/resolve?url={quote(short, safe="")}'),
              ('zhuadouyin_resolve_long', f'https://www.zhuadouyin.com/resolve?url={quote(long_url, safe="")}'),
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/json,text/plain,text/html,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://www.douyin.com/',
          }
          summary = []
          for index, (name, url) in enumerate(probes, 1):
              record = {'name': name, 'url': url}
              try:
                  started = time.time()
                  response = requests.get(url, headers=headers, timeout=(15, 90), allow_redirects=True)
                  elapsed = round(time.time() - started, 3)
                  body = response.content
                  record.update({
                      'status': response.status_code,
                      'final_url': response.url,
                      'content_type': response.headers.get('content-type', ''),
                      'bytes': len(body),
                      'elapsed_seconds': elapsed,
                      'headers': dict(response.headers),
                  })
                  suffix = '.json' if 'json' in record['content_type'].lower() else '.txt'
                  path = out / f'{index:02d}_{name}{suffix}'
                  path.write_bytes(body)
                  record['body_file'] = path.name
                  try:
                      parsed = response.json()
                      record['json'] = parsed
                  except Exception:
                      record['body_preview'] = body[:1500].decode('utf-8', errors='replace')
              except Exception as exc:
                  record['error'] = f'{type(exc).__name__}: {exc}'
              summary.append(record)
              print(json.dumps(record, ensure_ascii=False)[:5000])

          (out / 'resolver-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-7675989087379761103-resolver-matrix
          path: outputs/7675989087379761103-resolver-matrix
          if-no-files-found: error
          retention-days: 3
